<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="POS_Login_Page.css">

</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1>NetSuite POS</h1>
            <p>Please login to your account</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="username" id="username" name="username" placeholder="Enter your Username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="forgot-password">
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="login-button">Log In</button>
        </form>

        <div class="signup-text">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Step 1: Ask login Suitelet for config
            fetch(window.location.href, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'get_login_config' })
            })
                .then(res => res.json())
                .then(config => {
                    if (!config.loginUrl || !config.dashboardSuiteletUrl) {
                        throw new Error('Login config not returned');
                    }

                    // Step 2: Login
                    return fetch(config.loginUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }).then(res => res.json())
                        .then(data => ({ data, dashboardUrl: config.dashboardSuiteletUrl }));
                })
                .then(({ data, dashboardUrl }) => {
                    if (!data.success) {
                        alert(data.message);
                    } else {
                        // ✅ Redirect to Dashboard SUITELET
                        window.location.href = dashboardUrl;
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('System error occurred');
                });
        });
    </script>


</body>

</html>
