<!DOCTYPE html>
<html>

<head>
    <title>Admin Page</title>
    <link rel="stylesheet" type="text/css"
        href="https://6371802-sb1.app.netsuite.com/core/media/media.nl?id=22918&c=6371802_SB1&h=CssKZaBfSnQB9yFDHbDdeFENgW-cueZF2l7OHBpIxSFy2mIC&_xt=.css">
</head>

<body>
    <div class="admin-container">

        <h2>Admin - Customer Users</h2>

        <!-- New User Button -->
        <form method="POST" action="" target="_blank" style="margin-bottom: 20px;">
            <input type="hidden" name="createNew" value="true" />
            <button type="submit">+ New User</button>
        </form>




        <table id="userTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Username</th>
                    <th>Inactive</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- Populated by JS -->
            </tbody>
        </table>
    </div>

    <!--USER_DATA_PLACEHOLDER-->
    <!-- inside <script> tag -->
    <script>
        function populateTable() {
            var tableBody = document.getElementById("userTableBody");
            userData.forEach(function (user) {
                var row = `<tr>
    <td>${user.id}</td>
    <td>${user.customer}</td>
    <td>${user.username}</td>
    <td>${user.inactive === "T" ? "Yes" : "No"}</td>
    <td style="white-space: nowrap;">
        <!-- Edit Form -->
        <form method="POST" action="" target="_blank" style="display:inline;">
            <input type="hidden" name="recordId" value="${user.id}" />
<button type="submit" class="edit-btn">Edit</button>
        </form>

        <!-- Delete Form -->
        <form method="POST" action="" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this user?');">
            <input type="hidden" name="recordId" value="${user.id}" />
            <input type="hidden" name="delete" value="true" />
<button type="submit" class="delete-btn">Delete</button>
        </form>
    </td>
</tr>`;

                tableBody.innerHTML += row;
            });
        }

        window.onload = populateTable;
    </script>

</body>

</html>
