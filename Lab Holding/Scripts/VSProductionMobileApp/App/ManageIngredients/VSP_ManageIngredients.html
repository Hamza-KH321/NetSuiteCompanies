<!-- @fileName VSP_ManageIngredients.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Manage Ingredients - VS Production</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{HEADER_CSS_URL}}">
    <link rel="stylesheet" href="{{COMMON_CSS_URL}}">
</head>
<body>
    <div id="sharedHeader"></div>
    <main class="app-main">
        <section class="hero-card">
            <p class="hero-eyebrow">Manage Ingredients</p>
            <h1>Load Production Order</h1>
            <p>Enter a production order number to load its ingredients.</p>
            <div class="search-row">
                <input id="orderNumberInput" type="text" placeholder="e.g. 0006" enterkeyhint="search" autocapitalize="characters" autocomplete="off">
                <button id="loadOrderButton" type="button">Load</button>
            </div>
            <p id="searchError" class="error hidden"></p>
        </section>

        <div id="orderResult" class="hidden">
            <section class="hero-card" style="margin-top:16px">
                <p class="hero-eyebrow">Production Order Details</p>
                <h1 id="orderNumber">-</h1>
                <div class="order-meta-grid">
                    <div>
                        <span class="chip-label">Recipe</span>
                        <strong id="orderRecipe">-</strong>
                    </div>
                    <div>
                        <span class="chip-label">Order Quantity</span>
                        <strong id="orderQty">-</strong>
                    </div>
                </div>
                <p id="orderNotes" class="hidden"></p>
            </section>

            <h2 class="section-title">Ingredients Usage Input</h2>
            <div id="ingredientList" class="ingredient-list"></div>

            <div class="save-bar">
                <span id="saveStatus" class="save-bar-status">No changes</span>
                <button id="saveButton" type="button" disabled>Save Changes</button>
            </div>
        </div>

        <div id="emptyState" class="empty-state">
            Enter a production order number above to get started.
        </div>
    </main>

    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-panel">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading</div>
        </div>
    </div>

    <script src="{{HEADER_JS_URL}}"></script>
    <script src="{{PAGE_JS_URL}}"></script>
</body>
</html>
